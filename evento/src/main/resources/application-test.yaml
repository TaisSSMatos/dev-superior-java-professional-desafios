spring:
  # JPA, SQL
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Dados de conexão com o banco H2
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:eventodb
    username: sa
    password: ''

  # H2 Client
  h2:
    console:
      enabled: true
      path: /h2-console